# Keeps the pinned major versions of the actions used in .github/workflows current.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    # Let a new release age a week before it is proposed.
    cooldown:
      default-days: 7
