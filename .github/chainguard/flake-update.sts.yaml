subject: repo:coredev-uk@64542347/nixos@1102177616:ref:refs/heads/main
claim_pattern:
  workflow_ref: coredev-uk/nixos/\.github/workflows/flake-update\.yml@refs/heads/main
permissions:
  contents: write
  pull_requests: write
