name: "Flake Builds"

# Full builds of every host. Evaluation alone (nix-check.yml) misses build failures, which
# mostly arrive with input updates, so build when flake.lock changes, weekly to catch
# anything else, and on demand from the Actions tab.
on:
  push:
    paths:
      - "flake.lock"
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            extra-substituters = https://catppuccin.cachix.org https://nix-citizen.cachix.org https://nix-community.cachix.org https://vicinae.cachix.org
            extra-trusted-public-keys = catppuccin.cachix.org-1:noG/4HkbhJb+lUAdKrph6LaozJvAeEEZj4N732IysmU= nix-citizen.cachix.org-1:lPMkWc2X8XD4/7YPEEwXKKBg+SVbYTVrAaLA2wQTKCo= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= vicinae.cachix.org-1:1kDrfienkGHPYbkpNj1mWTr7Fm1+zcenzgTizIcI3oc=

      - name: Build atlas system and home
        run: |
          nix build --no-link \
            .#nixosConfigurations.atlas.config.system.build.toplevel \
            '.#homeConfigurations."paul@atlas".activationPackage'

  poseidon:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Install nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            extra-substituters = https://catppuccin.cachix.org https://nix-community.cachix.org
            extra-trusted-public-keys = catppuccin.cachix.org-1:noG/4HkbhJb+lUAdKrph6LaozJvAeEEZj4N732IysmU= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - name: Build poseidon
        run: nix build --no-link .#darwinConfigurations.poseidon.system
