name: "Update flake inputs"

# Nightly, every flake input at once, in one pull request from BOT Cecil (bot-cecil[bot]) on the
# flake-update branch. It gets the checks main's ruleset requires: Flake Checks, and the atlas and
# poseidon builds (hosts.yml), which also put both systems into the binary cache. It merges itself
# (auto-merge, squash) once they pass. A failing update stays open and is redone from main each
# night, so it lands as soon as upstream (or main) fixes what broke; until then nothing else lands.
on:
  schedule:
    - cron: "30 23 * * *" # before the night, so both systems are built and cached by morning
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-26.04
    steps:
      # The bot-cecil app's credentials (1Password item kubernetes/bot-cecil). Its token's
      # pushes, unlike GITHUB_TOKEN's, trigger the PR's checks.
      - name: Generate BOT Cecil token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install nix
        uses: DeterminateSystems/nix-installer-action@v23

      # One line per root input whose locked source moved: a compare link for GitHub inputs.
      # Node names can be renumbered between locks (nixpkgs_2 …), so each side is looked up
      # through its own root. The inputs go into the body as a marker the Nix view reads.
      - name: Update every input
        id: update
        run: |
          old=$(mktemp)
          cp flake.lock "$old"
          nix flake update
          changed=$(jq -r --slurpfile old "$old" '
            .nodes as $n | $old[0].nodes as $o
            | [.nodes.root.inputs | to_entries[] | select(.value | type == "string")
              | select($o[$o.root.inputs[.key]].locked.narHash != $n[.value].locked.narHash) | .key]
            | join(" ")' flake.lock)
          echo "Inputs with updates: ${changed:-none}"
          # "a", "a and b", "a, b and c"
          read -ra ins <<<"$changed"
          n=${#ins[@]}
          if [ "$n" -le 1 ]; then
            list="${ins[*]}"
          else
            list="$(printf '%s, ' "${ins[@]:0:n-1}")"
            list="${list%, } and ${ins[n-1]}"
          fi
          {
            echo "title=chore(flake): update ${list}"
            echo 'changes<<EOF'
            for k in $changed; do
              jq -r --slurpfile old "$old" --arg k "$k" '
                $old[0].nodes[$old[0].nodes.root.inputs[$k]].locked as $a
                | .nodes[.nodes.root.inputs[$k]].locked as $b
                | if $b.type == "github" and ($a.rev // "") != "" then
                    "- `\($k)`: [`\($a.rev[0:7])` → `\($b.rev[0:7])`](https://github.com/\($b.owner)/\($b.repo)/compare/\($a.rev)...\($b.rev))"
                  else
                    "- `\($k)`: `\(($a.rev // $a.narHash)[0:12])` → `\(($b.rev // $b.narHash)[0:12])`"
                  end' flake.lock
            done
            echo
            echo "<!-- inputs: ${changed} -->"
            echo EOF
          } >>"$GITHUB_OUTPUT"

      # sign-commits: the commit goes through GitHub's API, so it is BOT Cecil's and Verified.
      # With nothing to change (main already has every input's latest), the branch and its pull
      # request are removed.
      - name: Open or refresh the update
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          branch: flake-update
          delete-branch: true
          add-paths: flake.lock
          commit-message: |
            ${{ steps.update.outputs.title }}

            ${{ steps.update.outputs.changes }}
          title: ${{ steps.update.outputs.title }}
          body: |
            ${{ steps.update.outputs.changes }}

            Merges itself once Flake Checks and the atlas and poseidon builds pass. Redone from main each night until then.

      - name: Merge once the required checks pass
        if: steps.pr.outputs.pull-request-number != '' && steps.pr.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash
