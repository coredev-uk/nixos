name: "Flake Checks"

# Fast eval + flake checks (formatting) on every push, no host builds (those are hosts.yml).
on:
  push:
    # Can't affect evaluated outputs.
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "vfio-hardening/**"
  workflow_dispatch:

permissions:
  contents: read

# Newer push supersedes a running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # hosts/default.nix caches minus attic.hera.ac (builds only).
      - name: Install nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            extra-substituters = https://nix-citizen.cachix.org https://nix-community.cachix.org
            extra-trusted-public-keys = nix-citizen.cachix.org-1:lPMkWc2X8XD4/7YPEEwXKKBg+SVbYTVrAaLA2wQTKCo= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      # NixOS configs, devShells, formatter, overlays, all systems.
      - name: Evaluate flake outputs (no build)
        run: nix flake check --no-build --all-systems

      # `--no-build` only evaluates checks; build this runner's system's (formatting).
      - name: Build flake checks
        run: nix flake check -L

      # Not covered by `nix flake check`. poseidon has no IFD so x86_64-linux can evaluate it;
      # building needs macOS (hosts.yml).
      - name: Evaluate home-manager and nix-darwin configurations
        run: |
          nix eval --raw '.#homeConfigurations."paul@atlas".activationPackage.drvPath'
          nix eval --raw .#darwinConfigurations.poseidon.system.drvPath

  # Reads flake.lock only.
  flake-checker:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check flake inputs
        uses: DeterminateSystems/flake-checker-action@v14
        with:
          nixpkgs-keys: nixpkgs,unstable
