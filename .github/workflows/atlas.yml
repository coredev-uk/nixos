name: "Atlas"

# atlas's system and Home Manager configuration, built on every pull request (the nightly
# flake-update trials among them; main's ruleset requires this job) and every push to main, and
# pushed to the binary cache atlas substitutes from: https://nix-cache.hera.ac, an R2 bucket
# written through niks3 (coredev-uk/home-ops kubernetes/apps/nix-cache). niks3-action uploads
# each derivation as it finishes, so a failed or cancelled build still caches what it got
# through. A target the cache already has is neither built nor downloaded, so a commit that
# doesn't change atlas (or a landing pull request whose trials already built it) finishes in a
# minute or two. On main the two results are pinned, so the cache keeps the system atlas would
# switch to however old it gets.
on:
  pull_request:
  push:
    branches:
      - main
    # Nothing in these affects atlas.
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "vfio-hardening/**"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes a running build; what it already built is cached.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atlas:
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    permissions:
      contents: read
      id-token: write # niks3 authenticates the uploads with the workflow's OIDC token
    env:
      SYSTEM: .#nixosConfigurations.atlas.config.system.build.toplevel
      HOME_CONFIG: .#homeConfigurations."paul@atlas".activationPackage
      # nix-fast-build's targets, by the names the pins use.
      TARGETS: >-
        flake: {
          atlas = flake.nixosConfigurations.atlas.config.system.build.toplevel;
          paul-at-atlas = flake.homeConfigurations."paul@atlas".activationPackage;
        }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The runner's disk holds atlas's closure (about 20 GiB) only once the preinstalled
      # toolchains are gone; this also gives /nix the rest of the disk. In the foreground: the
      # purge empties /opt/hostedtoolcache, where niks3-action installs its post-build hook.
      - uses: wimpysworld/nothing-but-nix@v12
        with:
          witness-carnage: true

      # The caches hosts/default.nix configures; niks3-action adds nix-cache.hera.ac.
      - name: Install nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            extra-substituters = https://nix-citizen.cachix.org https://nix-community.cachix.org
            extra-trusted-public-keys = nix-citizen.cachix.org-1:lPMkWc2X8XD4/7YPEEwXKKBg+SVbYTVrAaLA2wQTKCo= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - name: Set up the binary cache
        id: niks3
        uses: Mic92/niks3-action@v1
        with:
          server-url: https://niks3.hera.ac

      # --skip-cached: a target already in a substituter is left there. Anything else builds in
      # one run, so a package both targets share is built (or fails) once, and the other target
      # still builds when one fails.
      - name: Build atlas
        run: >-
          nix run github:Mic92/nix-fast-build/2.0.4 --
          --no-nom --skip-cached --flake '.#' --select "$TARGETS"

      # A target built here is pinned with `push --pin`, which waits for its closure to be in the
      # cache (the hook's uploads may still be queued). One skipped as cached is already there, and
      # `pins create` points the pin at it without the closure on this runner.
      - name: Pin main's system and home
        if: github.ref == 'refs/heads/main'
        env:
          NIKS3: ${{ steps.niks3.outputs.binary-dir }}/niks3
          TOKEN_SCRIPT: ${{ steps.niks3.outputs.auth-token-script }}
        run: |
          pin() {
            local out
            out=$(nix eval --raw "$2.outPath")
            if nix path-info "$out" >/dev/null 2>&1; then
              "$NIKS3" push --server-url https://niks3.hera.ac --auth-token-script "$TOKEN_SCRIPT" --pin "$1" "$out"
            else
              "$NIKS3" pins create --server-url https://niks3.hera.ac --auth-token-script "$TOKEN_SCRIPT" "$1" "$out"
            fi
          }
          pin atlas "$SYSTEM"
          pin paul-at-atlas "$HOME_CONFIG"
