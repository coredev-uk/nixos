name: "Poseidon"

# poseidon's nix-darwin system (with its Home Manager configuration), built on every pull request
# (the nightly per-input flake updates among them; main's ruleset requires this job), every push
# to main, weekly to catch anything else, and on demand from the Actions tab; atlas builds in
# atlas.yml. Pushed to the same binary cache as atlas: https://nix-cache.hera.ac, an R2 bucket
# written through niks3 (coredev-uk/home-ops kubernetes/apps/nix-cache), which poseidon
# substitutes from. Sources and other fixed-output paths are shared with atlas; everything built
# for aarch64-darwin is its own. A system the cache already has is neither built nor downloaded.
# On main it is pinned, so the cache keeps what poseidon would switch to however old it gets.
on:
  pull_request:
  push:
    branches:
      - main
    # Nothing in these affects poseidon.
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "vfio-hardening/**"
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes a running build; what it already built is cached.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  poseidon:
    runs-on: macos-26
    timeout-minutes: 300
    permissions:
      contents: read
      id-token: write # niks3 authenticates the uploads with the workflow's OIDC token
    env:
      SYSTEM: .#darwinConfigurations.poseidon.system
      # nix-fast-build's target, by the name the pin uses.
      TARGETS: >-
        flake: { poseidon = flake.darwinConfigurations.poseidon.system; }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The caches hosts/default.nix configures (not a flake nixConfig: that would warn on every
      # local nix command run by an untrusted user); niks3-action adds nix-cache.hera.ac.
      - name: Install nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            extra-substituters = https://nix-citizen.cachix.org https://nix-community.cachix.org
            extra-trusted-public-keys = nix-citizen.cachix.org-1:lPMkWc2X8XD4/7YPEEwXKKBg+SVbYTVrAaLA2wQTKCo= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - name: Set up the binary cache
        id: niks3
        uses: Mic92/niks3-action@v1
        with:
          server-url: https://niks3.hera.ac

      # --skip-cached: a system already in a substituter is left there.
      - name: Build poseidon
        run: >-
          nix run github:Mic92/nix-fast-build/2.0.4 --
          --no-nom --skip-cached --flake '.#' --select "$TARGETS"

      # A system built here is pinned with `push --pin`, which waits for its closure to be in the
      # cache (the hook's uploads may still be queued). One skipped as cached is already there, and
      # `pins create` points the pin at it without the closure on this runner.
      - name: Pin main's system
        if: github.ref == 'refs/heads/main'
        env:
          NIKS3: ${{ steps.niks3.outputs.binary-dir }}/niks3
          TOKEN_SCRIPT: ${{ steps.niks3.outputs.auth-token-script }}
        run: |
          out=$(nix eval --raw "$SYSTEM.outPath")
          if nix path-info "$out" >/dev/null 2>&1; then
            "$NIKS3" push --server-url https://niks3.hera.ac --auth-token-script "$TOKEN_SCRIPT" --pin poseidon "$out"
          else
            "$NIKS3" pins create --server-url https://niks3.hera.ac --auth-token-script "$TOKEN_SCRIPT" poseidon "$out"
          fi
