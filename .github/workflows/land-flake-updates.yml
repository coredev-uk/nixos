name: "Land flake updates"

# Lands the nightly trials (update-flake-lock.yml: one draft pull request per flake input, each
# with the checks main's ruleset requires) together: once every open trial has a result, the
# passing ones are git-merged, at the commits that passed, into one pull request on the
# flake-update branch from BOT Cecil (bot-cecil[bot]), which merges itself (auto-merge, squash)
# once its own checks pass. Two rounds of builds a night, however many inputs moved, and main only
# gets a combination that was checked as a whole. A trial that conflicts with the others is left
# out until it is redone on top of main. With no trial passing, an open landing pull request is
# closed.
#
# Runs when a trial's checks finish (Flake Checks, Poseidon and Atlas), and hourly in case
# one of those went unseen. A trial still pending after six hours is left out, so a stuck check
# doesn't hold the rest back.
on:
  # Safe here: the job runs nothing from a pull request, only merges flake.lock from BOT Cecil's own
  # branches in this repository.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Flake Checks", "Poseidon", "Atlas"]
    types:
      - completed
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  land:
    if: github.event_name != 'workflow_run' || startsWith(github.event.workflow_run.head_branch, 'flake-update/')
    runs-on: ubuntu-26.04
    steps:
      - name: Generate BOT Cecil token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # Outputs land (whether there is anything to do), inputs, body, title; flake.lock is left
      # as main's with the passing trials merged in.
      - name: Merge the passing trials
        id: merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          now=$(date +%s)
          # The required checks of commit $1: success, failure or pending.
          verdict() {
            gh api "repos/$GITHUB_REPOSITORY/commits/$1/check-runs?per_page=100" | jq -r '
              [.check_runs[] | {name, at: .started_at,
                state: (if .status != "completed" then "pending"
                        elif .conclusion == "success" or .conclusion == "neutral" or .conclusion == "skipped" then "success"
                        else "failure" end)}] as $all
              | [["evaluate", "flake-checker", "poseidon", "atlas"][] as $n
                  | ([$all[] | select(.name == $n)] | sort_by(.at) | last | .state) // "pending"]
              | if any(. == "failure") then "failure" elif all(. == "success") then "success" else "pending" end'
          }

          # BOT Cecil's pull requests from this repository only: a fork can name a branch the same.
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,headRefName,headRefOid,body,author,isCrossRepository \
            --jq '[.[] | select(.author.login == "app/bot-cecil" and (.isCrossRepository | not))]' >"$RUNNER_TEMP/prs.json"
          passing=()
          waiting=()
          while read -r number branch sha; do
            state=$(verdict "$sha")
            if [ "$state" = pending ]; then
              committed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha" --jq .commit.committer.date)
              if [ $((now - $(date -d "$committed" +%s))) -lt 21600 ]; then
                waiting+=("${branch#flake-update/}")
              fi
            elif [ "$state" = success ]; then
              passing+=("$number ${branch#flake-update/} $sha")
            fi
          done < <(jq -r '.[] | select(.headRefName | startswith("flake-update/")) | "\(.number) \(.headRefName) \(.headRefOid)"' "$RUNNER_TEMP/prs.json")

          if [ ${#waiting[@]} -gt 0 ]; then
            echo "Waiting on ${waiting[*]}"
            echo "land=wait" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          # The trials that passed, at the commits that did, in one line the landing PR records,
          # so a run with nothing new leaves it (and its checks) alone.
          marker="<!-- trials: $(printf '%s\n' "${passing[@]}" | awk '{print $2 "@" $3}' | sort | xargs) -->"
          current=$(jq -r '.[] | select(.headRefName == "flake-update") | .body' "$RUNNER_TEMP/prs.json")
          if [ ${#passing[@]} -gt 0 ] && grep -qF -- "$marker" <<<"$current"; then
            echo "The landing pull request already has these trials"
            echo "land=wait" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "BOT Cecil"
          git config user.email "bot-cecil@users.noreply.github.com"
          git switch -q -c landing
          landed=()
          changes=()
          left_out=()
          for trial in "${passing[@]}"; do
            read -r number input sha <<<"$trial"
            git fetch -q origin "$sha"
            if git merge -q --no-edit "$sha" >/dev/null 2>&1; then
              landed+=("$input")
              changes+=("- $(jq -r --argjson n "$number" '.[] | select(.number == $n) | .body | split("\n")[0]' "$RUNNER_TEMP/prs.json") (#$number)")
            else
              git merge --abort
              left_out+=("$input (#$number)")
            fi
          done
          cp flake.lock "$RUNNER_TEMP/flake.lock"
          git switch -q main
          cp "$RUNNER_TEMP/flake.lock" flake.lock

          if git diff --quiet -- flake.lock; then
            echo "Nothing to land"
            echo "land=none" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          # "a", "a and b", "a, b and c"
          list=$(printf '%s\n' "${landed[@]}" | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n\([^\n]*\)$/ and \1/' -e 's/\n/, /g')
          {
            echo "land=yes"
            echo "title=chore(flake): update $list"
            echo 'body<<EOF'
            printf '%s\n' "${changes[@]}"
            echo
            echo "The trials above passed every required check, each on its own; this checks them together, and merges itself once Flake Checks and the poseidon and atlas builds pass."
            if [ ${#left_out[@]} -gt 0 ]; then
              echo
              echo "Left out, conflicting with the others until redone on top of main: ${left_out[*]}."
            fi
            echo
            echo "$marker"
            echo EOF
          } >>"$GITHUB_OUTPUT"

      # sign-commits: the commit goes through GitHub's API, so it is BOT Cecil's and Verified.
      # land=none leaves flake.lock as main's, so the branch and its PR are removed.
      - name: Open, refresh or close the landing pull request
        id: pr
        if: steps.merge.outputs.land != 'wait'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          branch: flake-update
          delete-branch: true
          add-paths: flake.lock
          commit-message: |
            ${{ steps.merge.outputs.title }}

            ${{ steps.merge.outputs.body }}
          title: ${{ steps.merge.outputs.title }}
          body: ${{ steps.merge.outputs.body }}

      - name: Merge once the required checks pass
        if: steps.merge.outputs.land == 'yes' && steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash
