name: "Hosts"

# One matrix job per host (main's ruleset requires `atlas` and `poseidon`), pushed to Attic
# (https://attic.hera.ac/coredev; home-ops nix-cache), which skips what cache.nixos.org,
# nix-community or nix-citizen already sign.
#
# atlas: every PR, push to main, weekly and on demand, on nixos-runner (home cluster, one job per
# VM, Nix store persists between jobs). poseidon: the flake-update PR, weekly and on demand, on
# GitHub macOS runners (join the tailnet to push); otherwise its check passes without building.
#
# Each built target goes up with its runtime closure; a target already cached isn't built. On main
# each target's store path is recorded as a nix-cache/<target> status, which atlas's Nix view
# compares the running system against.
#
# nixos-runner runs PR code inside the home network: outside contributors need approval and forks
# get no ATTIC_TOKEN.
on:
  pull_request:
  push:
    branches:
      - main
    # Can't affect a host.
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "vfio-hardening/**"
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Newer push supersedes a running build; its progress is cached.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    permissions:
      contents: read
      statuses: write # main's nix-cache/<target> statuses
    strategy:
      # One host failing doesn't stop the other.
      fail-fast: false
      matrix:
        include:
          # Targets are nix-fast-build's, named as the statuses are. Standalone Home Manager
          # configs get <host>-home; poseidon's is inside its darwin system. athena shares most of
          # atlas's closure, so it rides the same runner; athena-windows is what apply.ps1 copies.
          - host: atlas
            runner: nixos-runner
            build: true
            targets: >-
              flake: {
                atlas = flake.nixosConfigurations.atlas.config.system.build.toplevel;
                atlas-home = flake.homeConfigurations."paul@atlas".activationPackage;
                athena = flake.nixosConfigurations.athena.config.system.build.toplevel;
                athena-home = flake.homeConfigurations."paul@athena".activationPackage;
                athena-windows = flake.nixosConfigurations.athena.config.system.build.windows;
              }
          # macOS runners are often down/queued and poseidon is rarely used: it builds with the
          # flake update, plus weekly and on demand.
          - host: poseidon
            runner: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.head_ref == 'flake-update') && 'macos-26' || 'ubuntu-26.04' }}
            build: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.head_ref == 'flake-update' }}
            targets: >-
              flake: { poseidon = flake.darwinConfigurations.poseidon.system; }
    env:
      TARGETS: ${{ matrix.targets }}
      # Empty on a fork's PR: builds without pushing.
      ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
      # Avoids the 60/h anonymous GitHub API limit for github: flake refs. Nix only.
      NIX_CONFIG: access-tokens = github.com=${{ github.token }}
    steps:
      - name: Skip ${{ matrix.host }}
        if: ${{ !matrix.build }}
        run: echo "${{ matrix.host }} builds with the flake update, weekly and on demand; nothing to build here."

      - if: ${{ matrix.build }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # nixos-runner already has Nix configured. macOS: hosts/default.nix's caches (not flake
      # nixConfig: warns for untrusted users). fallback: build when a substitute download fails
      # (NixOS/nix#16722: HTTP 416 on a retried NAR).
      - name: Install nix
        if: ${{ matrix.build && runner.os == 'macOS' }}
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            extra-substituters = https://nix-citizen.cachix.org https://nix-community.cachix.org https://attic.hera.ac/coredev
            extra-trusted-public-keys = nix-citizen.cachix.org-1:lPMkWc2X8XD4/7YPEEwXKKBg+SVbYTVrAaLA2wQTKCo= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= coredev:g2+SrYgQg5HPBFIFHqHszqjvH7n52Zi3HVraAlY0kl8=
            fallback = true

      # Cloudflare in front of attic.hera.ac rejects bodies > 100 MB (many poseidon paths): go over
      # the tailnet to envoy-external (headscale tag:ci, port 443 only). nixos-runner is inside already.
      - name: Join the tailnet
        if: ${{ matrix.build && runner.os == 'macOS' && env.ATTIC_TOKEN != '' }}
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          # No tailnet DNS: tag:ci can't reach the home resolvers.
          args: --login-server=https://hs.hera.ac --accept-dns=false
          hostname: github-${{ matrix.host }}-${{ github.run_id }}
      # The action sets macOS's resolver to MagicDNS regardless of --accept-dns (then nothing
      # resolves): restore runner DNS and pin attic.hera.ac.
      - name: Reach Attic over the tailnet
        if: ${{ matrix.build && runner.os == 'macOS' && env.ATTIC_TOKEN != '' }}
        run: |
          sudo networksetup -setdnsservers Ethernet empty
          sudo networksetup -setsearchdomains Ethernet empty
          echo "192.168.110.246 attic.hera.ac" | sudo tee -a /etc/hosts
          curl --silent --show-error --fail --output /dev/null https://cache.nixos.org/nix-cache-info
          curl --silent --show-error --fail https://attic.hera.ac/coredev/nix-cache-info

      # nixos-runner has attic; macOS gets it from the flake's nixpkgs.
      - name: Set up the binary cache
        if: ${{ matrix.build && env.ATTIC_TOKEN != '' }}
        run: |
          if ! command -v attic >/dev/null; then
            nix build --inputs-from . nixpkgs#attic-client --out-link "$RUNNER_TEMP/attic"
            echo "$RUNNER_TEMP/attic/bin" >>"$GITHUB_PATH"
            export PATH="$RUNNER_TEMP/attic/bin:$PATH"
          fi
          attic login hera https://attic.hera.ac/ "$ATTIC_TOKEN"

      # --skip-cached leaves targets already in a substituter. One run builds shared packages once,
      # and the other target still builds if one fails.
      #
      # Memory: nix-fast-build's default 4 GiB x one worker per CPU OOM-killed the 8 GiB runner VM
      # (no job log). 2 workers restarted past 2 GiB, plus oom_score_adj 1000 (inherited by build
      # processes, no privilege needed, no /proc on macOS) make the build the OOM victim instead.
      - name: Build ${{ matrix.host }}
        if: ${{ matrix.build }}
        run: |
          if [ -w /proc/self/oom_score_adj ]; then echo 1000 >/proc/self/oom_score_adj; fi
          nix run github:Mic92/nix-fast-build/2.0.4 -- \
            --no-nom --skip-cached --eval-workers 2 --eval-max-memory-size 2048 \
            --flake '.#' --select "$TARGETS"

      # Push each target built on this runner (a cached skip may not be present) with its runtime
      # closure, minus what the cache or upstreams have. Attic recognises upstream paths by
      # signature, which locally built or image-seeded paths lack, so copy-sigs from upstreams
      # first. Runs after a failed build too; pushes are retried (dropped connections).
      - name: Push ${{ matrix.host }}
        if: ${{ !cancelled() && matrix.build && env.ATTIC_TOKEN != '' }}
        run: |
          nix eval --json --impure --expr \
            "builtins.mapAttrs (_: d: d.outPath) (($TARGETS) (builtins.getFlake \"git+file://$PWD?shallow=1\"))" \
            >"$RUNNER_TEMP/outputs.json"
          jq -r '.[]' "$RUNNER_TEMP/outputs.json" | while read -r out; do
            if nix path-info "$out" >/dev/null 2>&1; then
              # Signed paths carry signatures after a tab. nixos-runner has no awk.
              unsigned=$(nix path-info --recursive --sigs "$out" | grep -v "$(printf '\t')" || true)
              if [ -n "$unsigned" ]; then
                # shellcheck disable=SC2086 # one store path per word
                nix store copy-sigs --substituter https://cache.nixos.org \
                  --substituter https://nix-community.cachix.org \
                  --substituter https://nix-citizen.cachix.org $unsigned
              fi
              attic push hera:coredev "$out" || attic push hera:coredev "$out" || attic push hera:coredev "$out"
            fi
          done

      # Status nix-cache/<target> on the commit, store path as description, for each target the cache has.
      - name: Record main's ${{ matrix.host }}
        if: ${{ !cancelled() && matrix.build && github.ref == 'refs/heads/main' && env.ATTIC_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -r 'to_entries[] | "\(.key) \(.value)"' "$RUNNER_TEMP/outputs.json" |
            while read -r name out; do
              hash=${out#/nix/store/}
              if curl --silent --fail --output /dev/null "https://attic.hera.ac/coredev/${hash%%-*}.narinfo"; then
                gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --silent \
                  -f state=success -f context="nix-cache/$name" -f description="$out" -f target_url="$RUN_URL"
              fi
            done
