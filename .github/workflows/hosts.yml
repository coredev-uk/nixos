name: "Hosts"

# One matrix job per host (main's ruleset requires `atlas` and `poseidon`), pushed to Attic
# (https://attic.hera.ac/coredev; home-ops nix-cache), which skips what cache.nixos.org,
# nix-community or nix-citizen already sign.
#
# atlas: every PR, push to main, weekly and on demand, on nixos-runner (home cluster, one job per
# VM, Nix store persists between jobs). poseidon: weekly and on demand, and when its system
# derivation differs from the base's (a PR from a flake-update/<input> branch, or a push to main),
# on GitHub macOS runners (join the tailnet to push); otherwise its check passes without building.
# A flake input only some hosts use therefore doesn't need a macOS runner, and a macOS outage can't
# hold up an update that doesn't touch poseidon.
#
# Each built target goes up with its runtime closure; a target already cached isn't built. On main
# each target's store path is recorded as a nix-cache/<target> status, which atlas's Nix view
# compares the running system against.
#
# On a pull request each host also compares its built closures with the base's (the build on main,
# in the cache): which packages changed version and how big the closure is, as a comment on the
# pull request (`report`). The comparison only substitutes, it builds nothing again. The same
# comment job says which overlays (overlays/expiry.nix) the update lets go.
#
# nixos-runner runs PR code inside the home network: outside contributors need approval and forks
# get no ATTIC_TOKEN.
on:
  pull_request:
  push:
    branches:
      - main
    # Can't affect a host.
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "vfio-hardening/**"
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Newer push supersedes a running build; its progress is cached.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Does poseidon's system differ from the base's? Evaluation only. The schedule and on-demand runs
  # build it unconditionally.
  plan:
    runs-on: ubuntu-26.04
    outputs:
      poseidon: ${{ steps.poseidon.outputs.build }}
    env:
      # Avoids the 60/h anonymous GitHub API limit for github: flake refs. Nix only.
      NIX_CONFIG: access-tokens = github.com=${{ github.token }}
    steps:
      - name: Check out the head
        if: ${{ github.event_name == 'push' || startsWith(github.head_ref, 'flake-update/') }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The base: the PR's base commit, or what main was before the push.
      - name: Check out the base
        if: ${{ (github.event_name == 'push' || startsWith(github.head_ref, 'flake-update/')) && github.event.before != '0000000000000000000000000000000000000000' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: base
          persist-credentials: false

      - name: Install nix
        if: ${{ github.event_name == 'push' || startsWith(github.head_ref, 'flake-update/') }}
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Does poseidon change?
        id: poseidon
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$EVENT" in
            schedule | workflow_dispatch) build=true ;;
            push) build=$([ "$(.github/scripts/poseidon-changed.sh base)" = changed ] && echo true || echo false) ;;
            *)
              case "$HEAD_REF" in
                flake-update/*) build=$([ "$(.github/scripts/poseidon-changed.sh base)" = changed ] && echo true || echo false) ;;
                *) build=false ;;
              esac
              ;;
          esac
          echo "poseidon builds: $build"
          echo "build=$build" >>"$GITHUB_OUTPUT"

  host:
    name: ${{ matrix.host }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    permissions:
      contents: read
      statuses: write # main's nix-cache/<target> statuses
    strategy:
      # One host failing doesn't stop the other.
      fail-fast: false
      matrix:
        include:
          # Targets are nix-fast-build's, named as the statuses are. Standalone Home Manager
          # configs get <host>-home; poseidon's is inside its darwin system. athena shares most of
          # atlas's closure, so it rides the same runner; athena-windows is what apply.ps1 copies.
          - host: atlas
            runner: nixos-runner
            build: true
            targets: >-
              flake: {
                atlas = flake.nixosConfigurations.atlas.config.system.build.toplevel;
                atlas-home = flake.homeConfigurations."paul@atlas".activationPackage;
                athena = flake.nixosConfigurations.athena.config.system.build.toplevel;
                athena-home = flake.homeConfigurations."paul@athena".activationPackage;
                athena-windows = flake.nixosConfigurations.athena.config.system.build.windows;
              }
          # macOS runners are often down/queued and poseidon is rarely used: it builds when the
          # change touches it (plan), plus weekly and on demand.
          - host: poseidon
            runner: ${{ needs.plan.outputs.poseidon == 'true' && 'macos-26' || 'ubuntu-26.04' }}
            build: ${{ needs.plan.outputs.poseidon == 'true' }}
            targets: >-
              flake: { poseidon = flake.darwinConfigurations.poseidon.system; }
    env:
      TARGETS: ${{ matrix.targets }}
      # Empty on a fork's PR: builds without pushing.
      ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
      # Avoids the 60/h anonymous GitHub API limit for github: flake refs. Nix only.
      NIX_CONFIG: access-tokens = github.com=${{ github.token }}
    steps:
      - name: Skip ${{ matrix.host }}
        if: ${{ !matrix.build }}
        run: echo "${{ matrix.host }} builds weekly, on demand and when its system changes; nothing to build here."

      - if: ${{ matrix.build }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # nixos-runner already has Nix configured. macOS: hosts/default.nix's caches (not flake
      # nixConfig: warns for untrusted users). fallback: build when a substitute download fails
      # (NixOS/nix#16722: HTTP 416 on a retried NAR).
      - name: Install nix
        if: ${{ matrix.build && runner.os == 'macOS' }}
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            extra-substituters = https://nix-citizen.cachix.org https://nix-community.cachix.org https://attic.hera.ac/coredev
            extra-trusted-public-keys = nix-citizen.cachix.org-1:lPMkWc2X8XD4/7YPEEwXKKBg+SVbYTVrAaLA2wQTKCo= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= coredev:g2+SrYgQg5HPBFIFHqHszqjvH7n52Zi3HVraAlY0kl8=
            fallback = true

      # Cloudflare in front of attic.hera.ac rejects bodies > 100 MB (many poseidon paths): go over
      # the tailnet to envoy-external (headscale tag:ci, port 443 only). nixos-runner is inside already.
      - name: Join the tailnet
        if: ${{ matrix.build && runner.os == 'macOS' && env.ATTIC_TOKEN != '' }}
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          # No tailnet DNS: tag:ci can't reach the home resolvers.
          args: --login-server=https://hs.hera.ac --accept-dns=false
          hostname: github-${{ matrix.host }}-${{ github.run_id }}
      # The action sets macOS's resolver to MagicDNS regardless of --accept-dns (then nothing
      # resolves): restore runner DNS and pin attic.hera.ac.
      - name: Reach Attic over the tailnet
        if: ${{ matrix.build && runner.os == 'macOS' && env.ATTIC_TOKEN != '' }}
        run: |
          sudo networksetup -setdnsservers Ethernet empty
          sudo networksetup -setsearchdomains Ethernet empty
          echo "192.168.110.246 attic.hera.ac" | sudo tee -a /etc/hosts
          curl --silent --show-error --fail --output /dev/null https://cache.nixos.org/nix-cache-info
          curl --silent --show-error --fail https://attic.hera.ac/coredev/nix-cache-info

      # nixos-runner has attic; macOS gets it from the flake's nixpkgs.
      - name: Set up the binary cache
        if: ${{ matrix.build && env.ATTIC_TOKEN != '' }}
        run: |
          if ! command -v attic >/dev/null; then
            nix build --inputs-from . nixpkgs#attic-client --out-link "$RUNNER_TEMP/attic"
            echo "$RUNNER_TEMP/attic/bin" >>"$GITHUB_PATH"
            export PATH="$RUNNER_TEMP/attic/bin:$PATH"
          fi
          attic login hera https://attic.hera.ac/ "$ATTIC_TOKEN"

      # --skip-cached leaves targets already in a substituter. One run builds shared packages once,
      # and the other target still builds if one fails. The step's own timeout, under the job's,
      # makes a stuck build fail rather than cancel the job, so the build logs and the push still run.
      #
      # Memory: nix-fast-build's default 4 GiB x one worker per CPU OOM-killed the 8 GiB runner VM
      # (no job log). 2 workers restarted past 2 GiB, plus oom_score_adj 1000 (inherited by build
      # processes, no privilege needed, no /proc on macOS) make the build the OOM victim instead.
      - name: Build ${{ matrix.host }}
        id: build
        if: ${{ matrix.build }}
        timeout-minutes: 270
        run: |
          touch "$RUNNER_TEMP/build-start"
          if [ -w /proc/self/oom_score_adj ]; then echo 1000 >/proc/self/oom_score_adj; fi
          nix run github:Mic92/nix-fast-build/2.0.4 -- \
            --no-nom --skip-cached --eval-workers 2 --eval-max-memory-size 2048 \
            --flake '.#' --select "$TARGETS"

      # nix-fast-build shows a failing derivation's command but often not its error, and nothing
      # of one still running at the timeout. The tails of the build logs Nix wrote during this job,
      # newest first: the stuck or failed builds are among them. Clarence reads this section for
      # its nix-cache failure note.
      - name: Build logs
        if: ${{ failure() && matrix.build }}
        run: |
          logs=$(find /nix/var/log/nix/drvs -type f -newer "$RUNNER_TEMP/build-start" 2>/dev/null || true)
          [ -n "$logs" ] || { echo "No build logs from this job."; exit 0; }
          # ls -t for newest first: store paths are base32, so ls's output splits safely.
          # shellcheck disable=SC2086,SC2012 # one path per word
          for log in $(ls -t $logs | head -n 6); do
            name=$(basename "$log" .bz2)
            drv="/nix/store/$(basename "$(dirname "$log")")$name"
            echo "::group::$name"
            nix log "$drv" 2>/dev/null | uniq | tail -n 60
            echo "::endgroup::"
          done

      # Each target's store path, for the pushes, the statuses and the closure diff.
      - name: Evaluate ${{ matrix.host }}'s targets
        if: ${{ !cancelled() && matrix.build }}
        run: .github/scripts/target-outputs.sh >"$RUNNER_TEMP/outputs.json"

      # Push each target built on this runner (a cached skip may not be present) with its runtime
      # closure, minus what the cache or upstreams have. Attic recognises upstream paths by
      # signature, which locally built or image-seeded paths lack, so copy-sigs from upstreams
      # first. Runs after a failed build too; pushes are retried (dropped connections).
      - name: Push ${{ matrix.host }}
        if: ${{ !cancelled() && matrix.build && env.ATTIC_TOKEN != '' }}
        run: |
          jq -r '.[]' "$RUNNER_TEMP/outputs.json" | while read -r out; do
            if nix path-info "$out" >/dev/null 2>&1; then
              # Signed paths carry signatures after a tab. nixos-runner has no awk.
              unsigned=$(nix path-info --recursive --sigs "$out" | grep -v "$(printf '\t')" || true)
              if [ -n "$unsigned" ]; then
                # shellcheck disable=SC2086 # one store path per word
                nix store copy-sigs --substituter https://cache.nixos.org \
                  --substituter https://nix-community.cachix.org \
                  --substituter https://nix-citizen.cachix.org $unsigned
              fi
              attic push hera:coredev "$out" || attic push hera:coredev "$out" || attic push hera:coredev "$out"
            fi
          done

      # Status nix-cache/<target> on the commit, store path as description, for each target the cache has.
      - name: Record main's ${{ matrix.host }}
        if: ${{ !cancelled() && matrix.build && github.ref == 'refs/heads/main' && env.ATTIC_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -r 'to_entries[] | "\(.key) \(.value)"' "$RUNNER_TEMP/outputs.json" |
            while read -r name out; do
              hash=${out#/nix/store/}
              if curl --silent --fail --output /dev/null "https://attic.hera.ac/coredev/${hash%%-*}.narinfo"; then
                gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --silent \
                  -f state=success -f context="nix-cache/$name" -f description="$out" -f target_url="$RUN_URL"
              fi
            done

      # What changed against the base's closures (pull requests only). The head is what was just
      # built (or is in the cache), the base is main's build from the cache: both only substitute.
      # Never fails the job: the required check is the build.
      - name: Check out the base
        if: ${{ !cancelled() && matrix.build && github.event_name == 'pull_request' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Compare ${{ matrix.host }} with the base
        id: closure
        if: ${{ !cancelled() && matrix.build && github.event_name == 'pull_request' && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: |
          .github/scripts/target-outputs.sh base >"$RUNNER_TEMP/base.json"
          FULL_OUT="$RUNNER_TEMP/closure-full.md" \
            .github/scripts/closure-diff.sh "$RUNNER_TEMP/outputs.json" "$RUNNER_TEMP/base.json" >"$RUNNER_TEMP/closure.md"
          {
            echo "### ${{ matrix.host }}"
            cat "$RUNNER_TEMP/closure-full.md"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Keep the comparison
        continue-on-error: true
        if: ${{ !cancelled() && steps.closure.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: closure-${{ matrix.host }}
          path: ${{ runner.temp }}/closure.md

  # One comment each on the pull request: how the hosts' closures change, and which overlays the
  # update lets go (overlays/expiry.nix). Edited in place on every run.
  report:
    # Comments are a courtesy: a step failing here never fails the pull request's checks (Clarence
    # reads every check run), hence continue-on-error on each.
    needs: host
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write # the comments
    env:
      GH_TOKEN: ${{ github.token }}
      # Avoids the 60/h anonymous GitHub API limit for github: flake refs. Nix only.
      NIX_CONFIG: access-tokens = github.com=${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
        continue-on-error: true
        with:
          persist-credentials: false

      - name: Check out the base
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Collect the closure comparisons
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: closure-*
          path: ${{ runner.temp }}/closure

      - name: Comment the closure changes
        continue-on-error: true
        run: |
          : >"$RUNNER_TEMP/closure-report.md"
          for dir in "$RUNNER_TEMP"/closure/closure-*; do
            [ -f "$dir/closure.md" ] || continue
            {
              echo "#### ${dir##*/closure-}"
              echo
              cat "$dir/closure.md"
              echo
            } >>"$RUNNER_TEMP/closure-report.md"
          done
          if [ -s "$RUNNER_TEMP/closure-report.md" ]; then
            { echo "### What changes in the closures"; echo; echo "Against the base, \`${{ github.event.pull_request.base.sha }}\`. The hosts' builds in this run, compared with main's from the cache."; echo; cat "$RUNNER_TEMP/closure-report.md"; } >"$RUNNER_TEMP/closure-comment.md"
          else
            : >"$RUNNER_TEMP/closure-comment.md"
          fi
          .github/scripts/sticky-comment.sh "$PR" hosts-closure "$RUNNER_TEMP/closure-comment.md"

      # An update (or a hand edit) can make an overlay's removal condition true.
      - name: Does the pull request touch the lock or the overlays?
        continue-on-error: true
        id: touched
        run: |
          if gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' | grep -qE '^(flake\.lock|overlays/)'; then
            echo "touched=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Install nix
        continue-on-error: true
        if: ${{ steps.touched.outputs.touched == 'true' }}
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Comment the overlays that can go
        continue-on-error: true
        if: ${{ steps.touched.outputs.touched == 'true' }}
        run: |
          .github/scripts/overlay-expiry.sh base >"$RUNNER_TEMP/expiry.md"
          if [ -s "$RUNNER_TEMP/expiry.md" ]; then
            { echo "### Overlays this lets go"; echo; cat "$RUNNER_TEMP/expiry.md"; } >"$RUNNER_TEMP/expiry-comment.md"
          else
            : >"$RUNNER_TEMP/expiry-comment.md"
          fi
          .github/scripts/sticky-comment.sh "$PR" overlay-expiry "$RUNNER_TEMP/expiry-comment.md"
