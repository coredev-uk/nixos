name: "Hosts"

# Every host's system, one matrix job each (main's ruleset requires both `atlas` and `poseidon`),
# built on every pull request (the nightly flake-update trials among them), every push to main,
# weekly to catch anything else, and on demand from the Actions tab. Each pushes to the binary
# cache the hosts substitute from: https://nix-cache.hera.ac, an R2 bucket written through niks3
# (coredev-uk/home-ops kubernetes/apps/nix-cache). niks3-action uploads each derivation as it
# finishes, so a failed or cancelled build still caches what it got through; sources and other
# fixed-output paths are shared between the hosts, everything else is per platform. A target the
# cache already has is neither built nor downloaded, so a commit that doesn't change a host (or a
# landing pull request whose trials already built it) finishes in a few minutes. On main every
# target is pinned, so the cache keeps what each host would switch to however old it gets.
on:
  pull_request:
  push:
    branches:
      - main
    # Nothing in these affects a host.
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "vfio-hardening/**"
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes a running build; what it already built is cached.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    permissions:
      contents: read
      id-token: write # niks3 authenticates the uploads with the workflow's OIDC token
    strategy:
      # One host failing doesn't stop the other's build or its cache uploads.
      fail-fast: false
      matrix:
        include:
          # The targets are nix-fast-build's, by the names the pins use. atlas's Home Manager
          # configuration (paul@atlas) is standalone, so it gets its own, atlas-home; poseidon's is
          # part of its nix-darwin system.
          - host: atlas
            runner: ubuntu-26.04
            targets: >-
              flake: {
                atlas = flake.nixosConfigurations.atlas.config.system.build.toplevel;
                atlas-home = flake.homeConfigurations."paul@atlas".activationPackage;
              }
          - host: poseidon
            runner: macos-26
            targets: >-
              flake: { poseidon = flake.darwinConfigurations.poseidon.system; }
    env:
      TARGETS: ${{ matrix.targets }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The Linux runner's disk holds atlas's closure (about 20 GiB) only once the preinstalled
      # toolchains are gone; this also gives /nix the rest of the disk. In the foreground: the
      # purge empties /opt/hostedtoolcache, where niks3-action installs its post-build hook.
      - if: runner.os == 'Linux'
        uses: wimpysworld/nothing-but-nix@v12
        with:
          witness-carnage: true

      # The caches hosts/default.nix configures (not a flake nixConfig: that would warn on every
      # local nix command run by an untrusted user); niks3-action adds nix-cache.hera.ac.
      - name: Install nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            extra-substituters = https://nix-citizen.cachix.org https://nix-community.cachix.org
            extra-trusted-public-keys = nix-citizen.cachix.org-1:lPMkWc2X8XD4/7YPEEwXKKBg+SVbYTVrAaLA2wQTKCo= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - name: Set up the binary cache
        id: niks3
        uses: Mic92/niks3-action@v1
        with:
          server-url: https://niks3.hera.ac

      # --skip-cached: a target already in a substituter is left there. Anything else builds in
      # one run, so a package two targets share is built (or fails) once, and the other target
      # still builds when one fails.
      - name: Build ${{ matrix.host }}
        run: >-
          nix run github:Mic92/nix-fast-build/2.0.4 --
          --no-nom --skip-cached --flake '.#' --select "$TARGETS"

      # A target built here is pinned with `push --pin`, which waits for its closure to be in the
      # cache (the hook's uploads may still be queued). One skipped as cached is already there, and
      # `pins create` points the pin at it without the closure on this runner.
      - name: Pin main's ${{ matrix.host }}
        if: github.ref == 'refs/heads/main'
        env:
          NIKS3: ${{ steps.niks3.outputs.binary-dir }}/niks3
          TOKEN_SCRIPT: ${{ steps.niks3.outputs.auth-token-script }}
        run: |
          nix eval --json --impure --expr \
            "builtins.mapAttrs (_: d: d.outPath) (($TARGETS) (builtins.getFlake \"git+file://$PWD?shallow=1\"))" |
            jq -r 'to_entries[] | "\(.key) \(.value)"' |
            while read -r name out; do
              if nix path-info "$out" >/dev/null 2>&1; then
                "$NIKS3" push --server-url https://niks3.hera.ac --auth-token-script "$TOKEN_SCRIPT" --pin "$name" "$out"
              else
                "$NIKS3" pins create --server-url https://niks3.hera.ac --auth-token-script "$TOKEN_SCRIPT" "$name" "$out"
              fi
            done
