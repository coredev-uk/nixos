name: "Hosts"

# Every host's system, one matrix job each (main's ruleset requires both `atlas` and `poseidon`),
# pushed to the binary cache the hosts substitute from: Attic at https://attic.hera.ac/coredev
# (coredev-uk/home-ops kubernetes/apps/nix-cache). Attic skips whatever cache.nixos.org,
# nix-community or nix-citizen already sign, so it holds only what nobody else builds.
#
# atlas builds on every pull request (the nightly flake-update trials among them), every push to
# main, weekly and on demand, on nixos-runner: the home cluster's runners (home-ops
# kubernetes/apps/actions-runner-system), one job at a time, each in its own VM, with a Nix store
# that carries over between jobs. poseidon builds weekly and on demand on GitHub's macOS runners,
# which join the tailnet to push; elsewhere its check passes without building, in seconds.
#
# Each target that built goes up with its runtime closure; nixos-runner's store keeps what a failed
# build got through for the next one. A target the cache already has is neither built nor
# downloaded. On main each target's store path is recorded as a nix-cache/<target> commit status,
# which atlas's Nix view compares the running system against.
#
# nixos-runner runs pull request code inside the home network: workflows from outside
# contributors wait for approval (repository settings), and a fork gets no ATTIC_TOKEN.
on:
  pull_request:
  push:
    branches:
      - main
    # Nothing in these affects a host.
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "vfio-hardening/**"
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes a running build; what it already built is cached.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    permissions:
      contents: read
      statuses: write # main's nix-cache/<target> statuses
    strategy:
      # One host failing doesn't stop the other's build or its cache uploads.
      fail-fast: false
      matrix:
        include:
          # The targets are nix-fast-build's, by the names the statuses use. atlas's Home Manager
          # configuration (paul@atlas) is standalone, so it gets its own, atlas-home; poseidon's is
          # part of its nix-darwin system.
          - host: atlas
            runner: nixos-runner
            build: true
            targets: >-
              flake: {
                atlas = flake.nixosConfigurations.atlas.config.system.build.toplevel;
                atlas-home = flake.homeConfigurations."paul@atlas".activationPackage;
              }
          # GitHub's macOS runners are often down or queued, and poseidon is rarely used: it builds
          # weekly (the schedule above) and when run by hand.
          - host: poseidon
            runner: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'macos-26' || 'ubuntu-26.04' }}
            build: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
            targets: >-
              flake: { poseidon = flake.darwinConfigurations.poseidon.system; }
    env:
      TARGETS: ${{ matrix.targets }}
      # Empty for a fork's pull request, which then builds without pushing.
      ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
      # GitHub's API for github: flake references: anonymous requests share the home IP's 60 an
      # hour. Nix reads it, the builds don't see it.
      NIX_CONFIG: access-tokens = github.com=${{ github.token }}
    steps:
      - name: Skip ${{ matrix.host }}
        if: ${{ !matrix.build }}
        run: echo "${{ matrix.host }} builds weekly and on demand; nothing to build for this ${{ github.event_name }}."

      - if: ${{ matrix.build }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # nixos-runner has Nix, configured with the hosts' caches and Attic. On macOS: the caches
      # hosts/default.nix configures (not a flake nixConfig: that would warn on every local nix
      # command run by an untrusted user). fallback: a path whose substitute fails to download is
      # built instead (NixOS/nix#16722: a NAR that arrived whole before its stream broke is
      # retried past its end and fails with HTTP 416).
      - name: Install nix
        if: ${{ matrix.build && runner.os == 'macOS' }}
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            extra-substituters = https://nix-citizen.cachix.org https://nix-community.cachix.org https://attic.hera.ac/coredev
            extra-trusted-public-keys = nix-citizen.cachix.org-1:lPMkWc2X8XD4/7YPEEwXKKBg+SVbYTVrAaLA2wQTKCo= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= coredev:g2+SrYgQg5HPBFIFHqHszqjvH7n52Zi3HVraAlY0kl8=
            fallback = true

      # Cloudflare, in front of attic.hera.ac, rejects request bodies over 100 MB, which many of
      # poseidon's paths are: over the tailnet the runner reaches envoy-external directly
      # (headscale tag:ci, allowed only its port 443). nixos-runner is already inside.
      - name: Join the tailnet
        if: ${{ matrix.build && runner.os == 'macOS' && env.ATTIC_TOKEN != '' }}
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          # The action already accepts the subnet routes the Talos nodes advertise.
          args: --login-server=https://hs.hera.ac
          hostname: github-${{ matrix.host }}-${{ github.run_id }}
      - name: Reach Attic over the tailnet
        if: ${{ matrix.build && runner.os == 'macOS' && env.ATTIC_TOKEN != '' }}
        run: echo "192.168.110.246 attic.hera.ac" | sudo tee -a /etc/hosts

      # nixos-runner has the attic client; on macOS it comes from the flake's own nixpkgs.
      - name: Set up the binary cache
        if: ${{ matrix.build && env.ATTIC_TOKEN != '' }}
        run: |
          if ! command -v attic >/dev/null; then
            nix build --inputs-from . nixpkgs#attic-client --out-link "$RUNNER_TEMP/attic"
            echo "$RUNNER_TEMP/attic/bin" >>"$GITHUB_PATH"
            export PATH="$RUNNER_TEMP/attic/bin:$PATH"
          fi
          attic login hera https://attic.hera.ac/ "$ATTIC_TOKEN"

      # --skip-cached: a target already in a substituter is left there. Anything else builds in
      # one run, so a package two targets share is built (or fails) once, and the other target
      # still builds when one fails.
      - name: Build ${{ matrix.host }}
        if: ${{ matrix.build }}
        run: >-
          nix run github:Mic92/nix-fast-build/2.0.4 --
          --no-nom --skip-cached --flake '.#' --select "$TARGETS"

      # Each target this job has (built here; one skipped as cached isn't necessarily on the
      # runner) goes up with its runtime closure, minus what the cache or its upstreams already
      # have. Attic tells the upstreams' paths by their signatures, which a path lacks when it
      # didn't come from them (nixos-runner's store is seeded from the nix image's; a local build
      # of something upstream has too): those get them from the upstreams first, where they exist.
      # Even after a failed build: the target that did build is cached. A push is retried, since
      # one upload's connection can drop; what already went up is skipped.
      - name: Push ${{ matrix.host }}
        if: ${{ !cancelled() && matrix.build && env.ATTIC_TOKEN != '' }}
        run: |
          nix eval --json --impure --expr \
            "builtins.mapAttrs (_: d: d.outPath) (($TARGETS) (builtins.getFlake \"git+file://$PWD?shallow=1\"))" \
            >"$RUNNER_TEMP/outputs.json"
          jq -r '.[]' "$RUNNER_TEMP/outputs.json" | while read -r out; do
            if nix path-info "$out" >/dev/null 2>&1; then
              # A signed path's line carries its signatures after a tab. nixos-runner has no awk.
              unsigned=$(nix path-info --recursive --sigs "$out" | grep -v "$(printf '\t')" || true)
              if [ -n "$unsigned" ]; then
                # shellcheck disable=SC2086 # one store path per word
                nix store copy-sigs --substituter https://cache.nixos.org \
                  --substituter https://nix-community.cachix.org \
                  --substituter https://nix-citizen.cachix.org $unsigned
              fi
              attic push hera:coredev "$out" || attic push hera:coredev "$out" || attic push hera:coredev "$out"
            fi
          done

      # What each host would switch to on main: a nix-cache/<target> status on the commit, with
      # the store path as its description, for each target the cache has.
      - name: Record main's ${{ matrix.host }}
        if: ${{ !cancelled() && matrix.build && github.ref == 'refs/heads/main' && env.ATTIC_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -r 'to_entries[] | "\(.key) \(.value)"' "$RUNNER_TEMP/outputs.json" |
            while read -r name out; do
              hash=${out#/nix/store/}
              if curl --silent --fail --output /dev/null "https://attic.hera.ac/coredev/${hash%%-*}.narinfo"; then
                gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --silent \
                  -f state=success -f context="nix-cache/$name" -f description="$out" -f target_url="$RUN_URL"
              fi
            done
