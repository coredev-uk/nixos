<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <circle cx="256" cy="256" r="240" fill="#1b2130"/>
  <!-- a snowflake of six arms, one per 60 degrees, in Nix's two blues -->
  <defs>
    <g id="arm" fill="none" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
      <path d="M256 216 V100"/>
      <path d="M216 132 L256 168 L296 132"/>
    </g>
  </defs>
  <use href="#arm" stroke="#7ebae4"/>
  <use href="#arm" stroke="#5277c3" transform="rotate(60 256 256)"/>
  <use href="#arm" stroke="#7ebae4" transform="rotate(120 256 256)"/>
  <use href="#arm" stroke="#5277c3" transform="rotate(180 256 256)"/>
  <use href="#arm" stroke="#7ebae4" transform="rotate(240 256 256)"/>
  <use href="#arm" stroke="#5277c3" transform="rotate(300 256 256)"/>
  <circle cx="256" cy="256" r="22" fill="#ffffff"/>
</svg>
